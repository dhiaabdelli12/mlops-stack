version: '3.8'

services:
  data_ingestion:
    build:
      context: .
      dockerfile: data_ingestion/Dockerfile
    container_name: data_ingestion
    env_file:
      - .env
    volumes:
      - ./data_ingestion/src:/app/src
      - ./config.yml:/app/config.yml
    networks:
      - ml-pipeline
    depends_on:
      - datastore

  data_exploration:
    build:
      context: .
      dockerfile: data_exploration/Dockerfile
    container_name: data_exploration
    env_file:
      - .env
    volumes:
      - ./data_exploration/src:/app/src
      - ./config.yml:/app/config.yml
    networks:
      - ml-pipeline
    depends_on:
      - datastore

  datastore:
    image: postgres:latest
    container_name: datastore
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-pipeline
  
  

  data_preparation:
    build:
      context: ./data_preparation
    container_name: data_preparation
    env_file:
      - .env
    volumes:
      - ./data_preparation:/app
      - ./config.yml:/app/config.yml
      - ./poetry.lock:/app/poetry.lock
      - ./pyproject.toml:/app/pyproject.toml
    networks:
      - ml-pipeline
    depends_on:
      - datastore

volumes:
  postgres_data:

networks:
  ml-pipeline:
    driver: bridge
