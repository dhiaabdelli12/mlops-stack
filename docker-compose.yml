version: '3.8'
services:
  ingestion:
    build: ./ingestion
    depends_on:
      - datastore
    env_file:
      - .env
    container_name: ingestion
    volumes:
      - ./ingestion:/app
    networks:
      - ml-pipeline

  datastore:
    image: postgres:latest
    container_name: datastore
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-pipeline

  
volumes:
  postgres_data:

networks:
  ml-pipeline:
    driver: bridge
